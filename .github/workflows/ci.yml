name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x, 26.x]
        include:
          - os: macos-latest
            node-version: 24.x

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run test suite
      run: npm test

    - name: Verify upstream CLI contract
      run: npm run test:upstream

    - name: Install and exercise actual tarball
      run: npm run test:package

  legacy-node20:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: npm
    - run: npm ci
    - run: npm test

  browser:
    # Keep the browser OS compatible with the pinned Playwright revision.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: npm
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: npm ci
    - run: python -m pip install -r tests/requirements-ui.txt
    - run: python -m playwright install --with-deps chromium
    - run: npm run test:ui -- --artifacts output/ci/ui
    - run: npm run test:motion -- --artifacts output/ci/motion
    - run: npm run benchmark
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: browser-evidence
        path: output/ci
        if-no-files-found: ignore
